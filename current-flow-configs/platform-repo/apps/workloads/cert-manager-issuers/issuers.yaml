apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: dclab-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dclab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: DCLab Phase 4A Root CA
  secretName: dclab-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: dclab-selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: dclab-ca
spec:
  ca:
    secretName: dclab-root-ca
