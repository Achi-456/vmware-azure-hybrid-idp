apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-runner
  namespace: gitea-runner
spec:
  serviceName: gitea-runner
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: trust-harbor-ca
          image: harbor-01.dclab.local/runner/act_runner:0.2.11
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /certs/harbor /docker-certs/harbor-01.dclab.local
              cp /harbor-ca/ca.crt /certs/harbor/ca.crt
              cp /harbor-ca/ca.crt /docker-certs/harbor-01.dclab.local/ca.crt
          volumeMounts:
            - name: harbor-ca
              mountPath: /harbor-ca
            - name: certs
              mountPath: /certs
            - name: docker-certs
              mountPath: /docker-certs
      containers:
        - name: runner
          image: harbor-01.dclab.local/runner/act_runner:0.2.11
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -s /data/.runner ]; then
                act_runner register \
                  --config /config/config.yaml \
                  --no-interactive \
                  --instance http://gitea.dclab.local \
                  --token "$(cat /run/secrets/token)" \
                  --name "rke2-runner-$(hostname)" \
                  --labels "ubuntu-latest:docker://harbor-01.dclab.local/runner/ubuntu:act-latest,docker-cli:docker://harbor-01.dclab.local/runner/docker:26.1-cli"
              fi
              act_runner daemon --config /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: runner-config
              mountPath: /config
            - name: runner-data
              mountPath: /data
            - name: runner-secret
              mountPath: /run/secrets
              readOnly: true
            - name: certs
              mountPath: /certs
            - name: docker-certs
              mountPath: /etc/docker/certs.d
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: dind
          image: harbor-01.dclab.local/runner/docker:26.1-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - --host=tcp://0.0.0.0:2375
            - --host=unix:///var/run/docker.sock
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: docker-certs
              mountPath: /etc/docker/certs.d
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: runner-config
          configMap:
            name: runner-config
        - name: runner-secret
          secret:
            secretName: runner-secret
            items:
              - key: token
                path: token
        - name: harbor-ca
          configMap:
            name: harbor-ca
        - name: certs
          emptyDir: {}
        - name: docker-certs
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
