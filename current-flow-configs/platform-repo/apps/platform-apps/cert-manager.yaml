apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.2
    helm:
      values: |
        crds:
          enabled: true
          keep: true
        image:
          repository: harbor-01.dclab.local/cert-manager/cert-manager-controller
          tag: v1.20.2
        webhook:
          image:
            repository: harbor-01.dclab.local/cert-manager/cert-manager-webhook
            tag: v1.20.2
        cainjector:
          image:
            repository: harbor-01.dclab.local/cert-manager/cert-manager-cainjector
            tag: v1.20.2
        startupapicheck:
          image:
            repository: harbor-01.dclab.local/cert-manager/cert-manager-startupapicheck
            tag: v1.20.2
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
